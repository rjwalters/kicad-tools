# Canonical ecosystem registry for kicad-tools (Issue #5839).
#
# This file records where kicad-tools sits among the projects around it:
# who produces the files we consume, who overlaps our surface, whose license
# forbids code reuse, and what we concluded when we evaluated them.
#
# THREE RULES, inherited from `benchmarks/external/boards.toml`:
#
#   1. NEVER VENDOR. No upstream source, board file or asset is committed to
#      this repo, for license and repo-size hygiene. This registry holds
#      facts and verdicts about other projects -- never their code.
#
#   2. FACTS ARE HUMAN-RATIFIED. `license`, `stars`, `last_push` and
#      `last_verified` are written by a human who checked them.
#      `scripts/ecosystem_refresh.py` *reports* drift and prints an
#      applicable diff; it never edits this file. Bump `last_verified` only
#      when you actually re-checked that project.
#
#   3. PINS ARE FULL SHAs. `pinned_commit` is a 40-hex commit, never a branch
#      or tag -- those move, and a moving pin makes a recorded measurement
#      unreproducible.
#
# `license` is the SPDX identifier from the upstream LICENSE file (or the
# project's own SPDX tag, e.g. in NOTICE) at `last_verified`, or the literal
# "NONE" when the project commits no LICENSE (which is *not* the same as
# public domain -- see `license_compat`). It records what a human read, not
# what the forge's license detector guessed.
#
# `upstream_license_detected` (optional) records the detector's answer when
# it disagrees with `license` for a known, non-substantive reason -- e.g.
# GitHub reports "NOASSERTION" for a verbatim MIT file it cannot classify, or
# the deprecated "GPL-3.0" for a GPL-3.0-or-later project. The refresh script
# treats that exact value as matching `license`, so the weekly drift run does
# not raise a false `license-changed`; any *other* detected value is still an
# error. Omit the field when the detector agrees with `license`.
#
# ORDER IS EDITORIAL. Projects render into the README in the order they
# appear here, grouped by `category`. The closest peer leads its section.
# Re-render after any edit: `uv run python scripts/ecosystem_render.py --write`
#
# Field reference and the controlled vocabularies for `category`, `relation`,
# `verdict` and `license_compat`: `src/kicad_tools/ecosystem/models.py`.
# Human-facing positioning narrative: `docs/ecosystem.md`.

