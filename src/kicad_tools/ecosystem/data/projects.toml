pinned_commit = "88d363d023a29ac719ef7caf12f3c99efe9adb0a"
research_docs = ["docs/research/tscircuit-evaluation.md"]
summary = """
"React for Electronics" -- circuits described in TypeScript/React and \
compiled to its own Circuit JSON. Its `circuit-json-to-kicad` converter \
emits `.kicad_sch`, `.kicad_pcb` (with traces, vias and pours) and \
`.kicad_pro`, and `kicad-to-circuit-json` reads them back, so it is an \
upstream producer of the files we consume, like atopile and SKiDL. \
**Gated and not yet usable as a front end**: five representative designs \
were run through `kct check --mfr`, LVS and `kicad-cli pcb drc \
--refill-zones`, before and after re-routing with `kct route`, and all \
five failed. The blocking defect is that its schematic and PCB \
converters name the same net differently, so no emitted project can pass \
LVS at all; vias, netclass and silkscreen defaults also sit below every \
mainstream fab floor. Our parser reads the files without complaint, and \
`kct route` produced opens where tscircuit's own autorouter produced \
shorts. Six upstream defects recorded with reproducers; the relation \
stays upstream/complementary and all six look fixable.\
"""
reeval_trigger = """
Re-run `benchmarks/interop/tscircuit/run_gate.py` once the \
schematic-vs-PCB net-name divergence is fixed upstream (defect 2 in the \
note) -- it is the one that makes every other number hard to read, and a \
clean LVS pass is what would make tscircuit a supported front end. \
Upstream filing is tracked in #5878; the kct-side gaps the gate exposed \
are #5875 and #5876.\
"""

