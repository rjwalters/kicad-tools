# ---------------------------------------------------------------- positioning
#
# Where kicad-tools sits, as data rather than prose repeated in three places.
# `kct ecosystem where-we-sit` prints these; `docs/ecosystem.md` expands on
# them; `scripts/ecosystem_render.py` uses neither -- the README block is the
# project table only.

[positioning]
# What is true of kicad-tools and is NOT true of most of the registry.
invariants = [
  "Offline and file-based: every tool reads and writes `.kicad_sch` / `.kicad_pcb` directly. No running KiCad instance, no IPC, no GUI, no cloud service.",
  "Machine-readable by default: analysis and query commands emit JSON (`--format json`), because the primary caller is an agent, not a human.",
  "Verification is two-engine: `kct check --mfr` and `kicad-cli pcb drc --refill-zones` must BOTH report zero errors. Neither alone is sign-off.",
  "Electrical correctness is gated by LVS, not by DRC alone: copper is compared against the schematic netlist.",
  "The bar for 'done' is 100% of nets routed with 0 DRC violations and 0 sync drift -- not a partial-reach percentage.",
]

# What we deliberately do not do. Each line names who does it instead.
non_goals = [
  "No GUI and no KiCad fork: Zeo and Konnect own the live-editor surface.",
  "No schematic-capture language: atopile and SKiDL own design-as-code upstream of us.",
  "No cloud routing service: DeepPCB owns that trade-off, and it costs offline/air-gapped CI.",
  "No Specctra DSN/SES round-trip: freerouting and AutoRoute route a translated view; we stay on the board file so LVS and the fab gates see the artifact that ships.",
  "No breadth-first fabrication output matrix: KiBot is deeper on output variety; we automate getting a board to the point where those outputs are worth generating.",
]
