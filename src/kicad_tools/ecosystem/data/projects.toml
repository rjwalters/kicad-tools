# HEAD at our source read for issue #5941 ("Licence: GPL-3.0-or-later with a
# CUDA linking permission", 2026-10-05).
#
# The PCBWorld figures below are from punkfab.com/blog/tracemaker-router
# (2026-10-05), written by the circuit-skills author, not by TraceMaker's
# author and not reproduced by us. The post's own two tables disagree on the
# Freerouting 2.2.4 row (0.75/0.70/0.20 vs 0.73/0.60/0.30), hence "about".
# Discussion and what it means for our benchmark: issue #5942.
pinned_commit = "89ff58ca86b2104ac6c55ae8a5dc77e4ab3e8d00"
summary = """
C++20/CUDA KiCad 9/10 router that reads and writes `.kicad_pcb` directly \
and is judged by `kicad-cli` DRC. Octilinear-lattice A\\* with exact \
legality checks, negotiated rip-up, an 8-variant deterministic portfolio \
under a `--work` budget, min-cost-flow escape-corridor reservation, a \
nogood cache, coupled diff-pair search, and a SQLite bandit that learns \
which variant to pick across runs; the GPU only accelerates cost fields. \
On PCBWorld D3 the circuit-skills author reports 0.99 / 1.00 / 0.90 clean \
on the small / medium / large splits, against about 0.7 / 0.7 / 0.2 for \
Freerouting 2.2.4 -- third-party, single 60 s runs, not reproduced by us, \
and on PCBench boards TraceMaker was developed against (its own held-out \
figure is 73-78% clean). Its "clean" also excludes DRC errors already in \
the input board, looser than our 0-DRC bar. Days old; copyleft, so ideas \
only, and run only as an external binary.\
"""
reeval_trigger = """
Run it head-to-head against `kct route` on our fleet and on a PCBWorld \
split disjoint from its development set, re-scored under our 0-total-DRC \
bar (issues #5942, #5943). If it holds up, move to `benchmarked`; its \
portfolio-under-budget and escape/negotiation ideas are tracked in #5947.\
"""

