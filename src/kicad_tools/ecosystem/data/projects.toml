summary = """
the long-standing Specctra DSN/SES autorouter and the baseline most KiCad \
users try first. Has a headless CLI, but the DSN round-trip is a lossy \
interchange boundary: it routes a translated view of the board rather than \
the `.kicad_pcb` itself. We operate on the board file directly, which is \
what lets LVS and the manufacturing gates run against the same artifact \
that gets fabricated. PCBWorld's paper reports it as the strongest \
published rule-based baseline on real boards (Clean Pass 0.80 / 0.78 on \
D3-A / D3-B). fastroute is a faster Rust port of it with a \
byte-identical parity mode.\
"""
reeval_trigger = """
If we need freerouting's results as a baseline, run them through \
fastroute's `--parity` mode: same output, about 4-5x less wall time in \
its own measurements. Version matters too -- the circuit-skills harness \
found 2.2.4 stops earlier than 2.1.0 on PCBWorld D3.\
"""

