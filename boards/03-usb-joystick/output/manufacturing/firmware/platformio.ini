[env:joystick]
platform = atmelavr@5.3.0
board = kct_joystick
framework = arduino
; Joystick v2.1.1 is vendored in lib/Joystick with one documented serial change.
; Documented shared joystick identity; see README.
; Identity is recorded in boards/kct_joystick.json.
; Issue #5000: framework-arduino-avr 5.4.0 leaves USB suspend/resume clock
; handling as commented-out TODOs in USBCore.cpp. This pre-build hook patches
; the installed core; see patches/apply_usbcore_patch.py for the rationale.
extra_scripts = pre:patches/apply_usbcore_patch.py
build_flags =
    -DCDC_DISABLED
    -DUSB_CONFIG_POWER=100
upload_protocol = usbasp
upload_flags = -B10
; External 8 MHz crystal; ISP enabled; reset goes to application; HWB disabled;
; brownout nominal 3.4 V. No bootloader is installed.
board_fuses.lfuse = 0xFF
board_fuses.hfuse = 0xD9
board_fuses.efuse = 0xCA

; Pin transitive compiler/core packages as well as the AVR platform.
platform_packages =
    platformio/framework-arduino-avr@5.4.0
    platformio/toolchain-atmelavr@1.70300.191015
