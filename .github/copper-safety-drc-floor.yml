# `board-07-copper-safety-drc` job of .github/workflows/slow-tests.yml.
# Counts kicad-cli violations of type clearance, shorting_items,
# tracks_crossing, hole_clearance and copper_edge_clearance.  Ratchet only:
# the number may go down, never up (the job fails if this file's last change
# on main raised it).
floors:
