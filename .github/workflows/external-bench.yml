name: Board 06 seed-42 measurement

# Issue #7669: reproducible re-run of the four published external benchmark
# cases (pocketbeagle, beagleconnect_freedom, strf zero-touch; strf tuned) on
# the pinned KiCad container with the C++ router backend built.
#
# Dispatch-only and NEVER commits: the reports and provenance are uploaded as
# an artifact, and a human turns them into a dated collection under
# benchmarks/external/results/<date>/ via a normal PR (interpretation of the
# numbers is human-reviewed and bound to the tool commit SHA recorded below).
# Results are reported as measured, regressions included: a case that fails
# to route still uploads its report.
on:
  workflow_dispatch: {}

permissions:
  contents: read

# Same pinned image as ci.yml (#5682); keep the digest in sync with ci.yml's
# top-level KICAD_IMAGE so benchmark runs use the toolchain CI verifies.
env:
  KICAD_IMAGE: kicad/kicad@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec

concurrency:
  group: external-bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kicad_pin:
    name: KiCad image pin (env -> needs bridge)
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - id: pin
        run: echo "image=${KICAD_IMAGE}" >> "$GITHUB_OUTPUT"

  bench:
    name: Compare board 06 seed-42 backends
    needs: kicad_pin
    runs-on: ubuntu-latest
    timeout-minutes: 350
    container:
      image: ${{ needs.kicad_pin.outputs.image }}
      options: --user 0:0 --memory 12g
    defaults:
      run:
        shell: bash
    env:
      SEED: "42"
      PYTHONHASHSEED: "42"
    steps:
      - name: Ensure container has prerequisites
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git cmake build-essential jq
          kicad-cli --version

      - uses: actions/checkout@v7

      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize stock KiCad libraries
        run: python3 scripts/ci/init_kicad_libraries.py

      - name: Install uv
        # Same official one-liner as ci.yml's container jobs.
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Build C++ router backend
        run: uv run kct build-native

      - name: Regenerate and measure each backend
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          board=boards/06-diffpair-test
          for backend in cpp python; do
            dir="measurement/$backend"
            mkdir -p "$dir"
            for input in "$board"/regression-fixture/*; do
              case "$input" in *_routed.kicad_pcb|*.md) continue ;; esac
              cp "$input" "$dir/"
            done
            if [[ $backend == python ]]; then
              mv src/kicad_tools/router/router_cpp.*.so "$RUNNER_TEMP/"
            fi
            uv run python -c 'import sys; from kicad_tools.router.cpp_backend import get_backend_info; info = get_backend_info(); print(info); assert info["backend"] == sys.argv[1]' "$backend"
            uv run python "$board/generate_design.py" "$dir" --step route --seed 42 2>&1 | tee "$dir/route.log"
            pcb="$dir/diffpair_test_routed.kicad_pcb"
            test -s "$pcb"
            rc=0
            uv run kct check "$pcb" --mfr jlcpcb --format json > "$dir/check.json" || rc=$?
            echo "$backend kct check exit $rc"
            jq -e '.violations | type == "array"' "$dir/check.json"
            jq '[.violations[] | select(.rule_id == "physical_copper_gap" and (.severity == "error" or .severity == "warning")) | {nets,items,actual_value,layer}]' "$dir/check.json" | tee "$dir/slits.json"
            sha256sum "$pcb"
          done
          uv run python - <<'PYTHON'
          from collections import Counter
          from pathlib import Path
          from kicad_tools.schema.pcb import PCB
          def route(path):
              board = PCB.load(path)
              def name(obj):
                  return board.nets[obj.net_number].name
              return (Counter((name(s), s.layer, s.width, tuple(sorted((s.start, s.end)))) for s in board.segments),
                      Counter((name(v), v.position, v.size, v.drill, tuple(v.layers)) for v in board.vias))
          cpp, py = [Path("measurement") / backend / "diffpair_test_routed.kicad_pcb" for backend in ("cpp", "python")]
          print("PCB bytes identical:", cpp.read_bytes() == py.read_bytes())
          for kind, left, right in zip(("segments", "vias"), route(cpp), route(py)):
              print(kind, "C++ only:", (left-right).total(), "Python only:", (right-left).total())
          PYTHON

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board06-seed42-measurement
          path: measurement/
          retention-days: 14
