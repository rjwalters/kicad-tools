        },
        {
          "name": "Install dependencies",
          "run": "uv sync --frozen --extra dev --python 3.12"
        },
        {
          "name": "Controlled verification failure after staging a real committed PCB",
          "run": "set -euo pipefail\nmkdir -p boards/07-matchgroup-test/regression-output\ncp boards/07-matchgroup-test/regression-fixture/matchgroup_test_routed.kicad_pcb boards/07-matchgroup-test/regression-output/\npython3 -c 'raise AssertionError(\"Intentional artifact-transport verification; committed fixture, no reroute performed\")'\n"
        },
        {
          "name": "Collect failed routing bundle (diagnostic reproduction,",
          "if": "failure()",
          "run": "set -euo pipefail\nuv run python scripts/ci/collect_failed_routing_bundle.py \\\n  /tmp/failed-bundle \\\n  --source \"regression-output=${{ matrix.board }}/regression-output\" \\\n  --job matchgroup-routing-regression \\\n  --board \"${{ matrix.board }}\" \\\n  --commit \"${{ github.sha }}\" \\\n  --seed 42 \\\n  --command \"python ${{ matrix.board }}/generate_design.py ${{ matrix.board }}/regression-output --step route --seed 42\" \\\n  --python-version \"$(uv run python3 --version)\" \\\n  --kicad-version \"$(kicad-cli --version)\"\n"
        },
        {
          "name": "Upload failed routing bundle (diagnostic reproduction,",
          "if": "failure()",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "board07-matchgroup-routing-regression-${{ github.sha }}-${{ github.run_id }}",
            "path": "/tmp/failed-bundle/",
            "retention-days": 14
          }
        }
      ]
    },
    "board-06-end-to-end": {
      "name": "Board 06 End-to-End (LVS)",
      "runs-on": "${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('[\"self-hosted\",\"heavy\"]') || 'ubuntu-latest' }}",
      "timeout-minutes": 35,
      "container": {
        "image": "kicad/kicad:10.0",
        "options": "${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '--user 0:0 --cpuset-cpus 24-63 --memory 8g' || '--user 0:0' }}"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "PYTHONHASHSEED": "42",
        "PYTHONUNBUFFERED": "1"
      },
      "steps": [
        {
          "name": "Ensure container has prerequisites",
          "run": "set -euo pipefail\napt-get update\napt-get install -y --no-install-recommends \\\n  ca-certificates curl git cmake build-essential\nkicad-cli --version\n"
        },
        {
          "uses": "actions/checkout@v7"
        },
        {
          "name": "Initialize stock KiCad libraries",
          "run": "python3 scripts/ci/init_kicad_libraries.py"
        },
        {
          "name": "Install uv",
          "run": "set -euo pipefail\ncurl -LsSf https://astral.sh/uv/install.sh | sh\necho \"$HOME/.local/bin\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Install dependencies",
          "run": "uv sync --frozen --extra dev --python 3.12"
        },
        {
          "name": "Controlled verification failure after staging a real committed PCB",
          "run": "set -euo pipefail\nmkdir -p /tmp/board06-ci\ncp boards/06-diffpair-test/regression-fixture/diffpair_test_routed.kicad_pcb /tmp/board06-ci/\npython3 -c 'raise AssertionError(\"Intentional artifact-transport verification; committed fixture, no reroute performed\")'\n"
        },
        {
          "name": "Collect failed routing bundle (diagnostic reproduction,",
          "if": "failure()",
          "run": "set -euo pipefail\nuv run python scripts/ci/collect_failed_routing_bundle.py \\\n  /tmp/failed-bundle \\\n  --source \"board06-ci=/tmp/board06-ci\" \\\n  --source \"board06-copper.json=/tmp/board06-copper.json\" \\\n  --source \"board.json=/tmp/board06-staging/06-diffpair-test/output/board.json\" \\\n  --job board-06-end-to-end \\\n  --board boards/06-diffpair-test \\\n  --commit \"${{ github.sha }}\" \\\n  --seed 42 \\\n  --command \"python boards/06-diffpair-test/generate_design.py /tmp/board06-ci --step all --seed 42\" \\\n  --python-version \"$(uv run python3 --version)\" \\\n  --kicad-version \"$(kicad-cli --version)\"\n"
        },
        {
          "name": "Upload failed routing bundle (diagnostic reproduction,",
          "if": "failure()",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "board06-end-to-end-${{ github.sha }}-${{ github.run_id }}",
            "path": "/tmp/failed-bundle/",
            "retention-days": 14
          }
        }
      ]
    },
    "board-07-end-to-end": {
      "name": "Board 07 End-to-End (LVS known opens)",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 90,
      "container": {
        "image": "kicad/kicad:10.0",
        "options": "--user 0:0"
      },
      "defaults": {
        "run": {
          "shell": "bash"
        }
      },
      "env": {
        "PYTHONHASHSEED": "42",
        "PYTHONUNBUFFERED": "1"
      },
      "steps": [
        {
          "name": "Ensure container has prerequisites",
          "run": "set -euo pipefail\napt-get update\napt-get install -y --no-install-recommends \\\n  ca-certificates curl git cmake build-essential\nkicad-cli --version\n"
        },
        {
          "uses": "actions/checkout@v7"
        },
        {
          "name": "Initialize stock KiCad libraries",
          "run": "python3 scripts/ci/init_kicad_libraries.py"
        },
        {
          "name": "Install uv",
          "run": "set -euo pipefail\ncurl -LsSf https://astral.sh/uv/install.sh | sh\necho \"$HOME/.local/bin\" >> \"$GITHUB_PATH\"\n"
        },
        {
          "name": "Install dependencies",
          "run": "uv sync --frozen --extra dev --python 3.12"
        },
        {
          "name": "Controlled verification failure after staging a real committed PCB",
          "run": "set -euo pipefail\nmkdir -p /tmp/board07-ci\ncp boards/07-matchgroup-test/regression-fixture/matchgroup_test_routed.kicad_pcb /tmp/board07-ci/\npython3 -c 'raise AssertionError(\"Intentional artifact-transport verification; committed fixture, no reroute performed\")'\n"
        },
        {
          "name": "Collect failed routing bundle (diagnostic reproduction,",
          "if": "failure()",
          "run": "set -euo pipefail\nuv run python scripts/ci/collect_failed_routing_bundle.py \\\n  /tmp/failed-bundle \\\n  --source \"board07-ci=/tmp/board07-ci\" \\\n  --source \"board07-copper.json=/tmp/board07-copper.json\" \\\n  --source \"board.json=/tmp/board07-staging/07-matchgroup-test/output/board.json\" \\\n  --job board-07-end-to-end \\\n  --board boards/07-matchgroup-test \\\n  --commit \"${{ github.sha }}\" \\\n  --seed 42 \\\n  --command \"python boards/07-matchgroup-test/generate_design.py /tmp/board07-ci --step all --seed 42\" \\\n  --python-version \"$(uv run python3 --version)\" \\\n  --kicad-version \"$(kicad-cli --version)\"\n"
        },
        {
