name: Nightly Bayesian Placement

# Exercises BayesianOptStrategy against the real Ax/BoTorch stack. Kept off the
# per-PR path because ax-platform/botorch are heavy (issue #5801).
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bayesian:
    name: Bayesian strategy (Ax/BoTorch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "latest"
          enable-cache: false

      - name: Install dependencies
        run: uv sync --extra dev --extra bayesian

      - name: Run Bayesian strategy tests
        # test_bo_strategy.py importorskips ax; fail loudly if it was skipped.
        run: |
          uv run python -c "import ax, botorch"
          uv run pytest -o addopts= tests/test_bo_strategy.py tests/test_optimize_placement_cmd.py tests/test_mcp_optimize_placement.py -k "bayesian or bo_ or BO" -rs --timeout=1500
