name: Nightly Board 05 Unattended Route

# Issue #7834 (part of #4410): the regression proof that `kct route` produces
# board 05 from scratch, unattended, as a manufacturable board.
#
# The shipping recipe (boards/05-bldc-motor-controller/design.py ->
# redesign/build.py) replays reviewed copper from redesign/routing.json, and
# ci.yml's `board-05-routing-regression` job runs that recipe -- so neither
# tests the router. This workflow routes the recipe's UNROUTED board with
# `kct route` under the #6508 protocol flags at three seeds, then gates each
# seed on: every net complete, kicad-cli DRC 0 errors / 0 unconnected,
# kicad-cli ERC clean, `kct check --mfr jlcpcb` 0 errors, copper + label LVS
# clean. scripts/ci/board_05_unattended.py exits 1 on any failure (no
# allowlist) and 2 when kicad-cli is not the pinned release (#6962).
#
# Not per-PR: one seed is a full from-scratch route (~5 min on a host, more
# on a hosted runner) plus two DRC engines and LVS, and board 05 is the
# heaviest route in the fleet. Scheduled daily and dispatchable; not a
# required check. Per-seed results and which outcomes depend on host load:
# docs/research/board-05-unattended-route.md.

on:
  schedule:
    # 07:30 UTC daily -- after slow-tests (03:00), routing-benchmark (Sundays
    # 04:00) and ship-ready (06:00), so the runs do not contend for capacity.
    - cron: "30 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-board-05-unattended-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The digest stays single-sourced in ci.yml's workflow-level KICAD_IMAGE
  # (#5682, docs/contributing/kicad-image-pin.md); same bridge as
  # slow-tests.yml, since one workflow cannot read another's env.
  kicad_pin:
    name: KiCad image pin (read from ci.yml)
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.pin.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/ci.yml
          sparse-checkout-cone-mode: false

      - name: Publish ci.yml's KICAD_IMAGE into the needs context
        id: pin
        run: |
          set -euo pipefail
          images=$(sed -n 's/^  KICAD_IMAGE: *//p' .github/workflows/ci.yml)
          if [ "$(printf '%s\n' "$images" | grep -c .)" != "1" ] \
            || ! printf '%s' "$images" | grep -qE '^kicad/kicad@sha256:[0-9a-f]{64}$'; then
            echo "::error::expected exactly one 'KICAD_IMAGE: kicad/kicad@sha256:<digest>' in ci.yml, found: ${images:-<none>}"
            exit 1
          fi
          echo "image=${images}" >> "$GITHUB_OUTPUT"

  unattended-route:
    name: Board 05 unattended route (seed ${{ matrix.seed }})
    needs: [kicad_pin]
    runs-on: ubuntu-latest
    # kct route's own budget is 4500 s (75 min); the rest is install, the
    # native build and the gates. A seed that needs the whole budget has
    # regressed anyway, but it still gets a verdict instead of a cancel.
    timeout-minutes: 110
    strategy:
      # Every seed reports, so a seed-dependent outcome is visible.
      fail-fast: false
      matrix:
        seed:
          - 42
          - 7
          - 1337
    container:
      image: ${{ needs.kicad_pin.outputs.image }}
      # Root for system installs; 12g matches ci.yml's Test job, so a
      # kicad-cli OOM inside the router's pour oracle (#7836) is rare -- and
      # when it happens the row fails as "oracle did not answer", never passes.
      options: --user 0:0 --memory 12g
    defaults:
      run:
        shell: bash
    env:
      PYTHONHASHSEED: "0"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Ensure container has prerequisites
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git cmake build-essential
          kicad-cli --version

      - uses: actions/checkout@v7

      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Initialize stock KiCad libraries
        run: python3 scripts/ci/init_kicad_libraries.py

      - name: Install uv
        run: |
          set -euo pipefail
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: uv sync --frozen --extra dev --python 3.12

      - name: Build C++ router backend
        # uv sync does not build it; without it the A* loop is 10-100x slower.
        run: |
          set -euo pipefail
          uv run kct build-native
          uv run kct build-native --check

      - name: Route board 05 from scratch and gate (seed ${{ matrix.seed }})
        # Hard gate: exit 1 on any open net, DRC/ERC error, kct check error
        # or LVS mismatch; exit 2 on a non-pinned kicad-cli. No allowlist.
        run: |
          set -euo pipefail
          uv run python scripts/ci/board_05_unattended.py \
            --seeds "${{ matrix.seed }}" \
            --work-dir /tmp/board05-unattended \
            --json /tmp/board05-unattended/results.json

      - name: Upload routed board and evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: board05-unattended-seed-${{ matrix.seed }}-${{ github.run_id }}
          path: |
            /tmp/board05-unattended/results.json
            /tmp/board05-unattended/seed-*/route.log
            /tmp/board05-unattended/seed-*/bldc_controller_routed.kicad_pcb
            /tmp/board05-unattended/seed-*/evidence/
          retention-days: 30
          if-no-files-found: warn
