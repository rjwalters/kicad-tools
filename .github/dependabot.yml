# GENERATED by 2AMLogic/2am scripts/dependabot-render.py from 2AMLogic/fleet-gitops dependency-updates.json.
# Do not edit: a hand edit is reported as drift and overwritten. Change the policy
# there and re-render (runbook: 2AMLogic/2am infra/dependabot/README.md, 2am#4351).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 14
    labels: ["dependencies", "loom:review-requested"]
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["major", "minor", "patch"]
  - package-ecosystem: "uv"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 14
    labels: ["dependencies", "loom:review-requested"]
    groups:
      # Build-coupled (nanobind, cmake) or ABI-coupled (numpy): each gets its own PR, as under Renovate.
      uv-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["nanobind", "cmake", "numpy"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directories:
      - "/site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 14
    labels: ["dependencies", "loom:review-requested"]
    groups:
      # The Astro framework moves as its own PR, as under Renovate.
      npm-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["astro", "@astrojs/*"]
        update-types: ["minor", "patch"]
