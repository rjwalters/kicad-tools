# Native/current-rule release gate for the real demo designs.
# Boards absent from tolerances must produce zero blocking errors.
# Historical synthetic routing witnesses live under regression-fixture/ and
# are not manufacturing releases or targets of this output/ gate.
# The 2026-09-10 readiness audit retires the old board05/06/07 allowances.
# Evidence: docs/demo-readiness-2026-09-09.md and each output/readiness.json.
# Additions require a tracking issue and explicit review of the regression.
tolerances: {}

# Preserve the fabrication processes selected by the reviewed real designs.
manufacturers:
  boards/04-stm32-devboard/output/stm32_devboard_routed.kicad_pcb: jlcpcb-tier1
  boards/03-usb-joystick/output/usb_joystick_routed.kicad_pcb: jlcpcb-tier1
  boards/05-bldc-motor-controller/output/bldc_controller_routed.kicad_pcb: jlcpcb-tier1
